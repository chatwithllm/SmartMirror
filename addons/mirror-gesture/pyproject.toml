[project]
name = "mirror-gesture"
version = "0.2.0"
description = "Smart Mirror gesture service — kiosk-local MediaPipe + HTTP fan-out"
requires-python = ">=3.11"
dependencies = [
  "opencv-python==4.10.0.84",
  "mediapipe==0.10.18",
  "numpy<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit package list. `packages.find where=["src"]` (the previous
# config) discovers packages *inside* src/ and therefore found none,
# so `pip install -e .` produced an editable finder mapping nothing and
# `python -m mirror_gesture` died with ModuleNotFoundError.
[tool.setuptools]
packages = ["mirror_gesture"]
package-dir = { "mirror_gesture" = "src" }
